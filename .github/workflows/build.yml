name: Build

on: [push, pull_request]

jobs:

  # === Ubuntu gcc14 ===
  linux-gcc14-glibc239:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/ppa
          sudo apt update
          sudo apt-get install gcc-14 g++-14 libsdl2-dev libglu1-mesa-dev libasound2-dev libpulse-dev libaudio-dev libsamplerate0-dev -y
          sudo ln -s -f /usr/bin/gcc-14 /usr/bin/gcc
          sudo ln -s -f /usr/bin/g++-14 /usr/bin/g++
          
      - name: Build
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: "bitsybox-linux-gcc14"
          path: |
            bitsybox

  # === Windows MinGW-64 ===
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup Mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install
        run: |
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-headers-git mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-gcc-libs mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-extra-cmake-modules

      - name: Build
        shell: bash
        run: |
          cmake -G "MSYS Makefiles" . -DCMAKE_PREFIX_PATH="C:\msys64\ucrt64\bin\sdl2-config" -DCMAKE_BUILD_TYPE=Release
          cmake --build .
        
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: "bitsybox-windows-mingw"
          path: |
            bitsybox

  # === MacOS 13 ===
  macos:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install
        run: brew uninstall --ignore-dependencies libidn2 && brew install sdl2

      - name: Build
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: "bitsybox-macos"
          path: |
            bitsybox
