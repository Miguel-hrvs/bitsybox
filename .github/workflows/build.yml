name: Build

on: [push, pull_request]

jobs:

  # === Ubuntu gcc14 ===
  linux-gcc14-glibc239:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/ppa
          sudo apt update
          sudo apt-get install gcc-14 g++-14 libsdl2-dev nodejs libglu1-mesa-dev libasound2-dev libpulse-dev libaudio-dev libsamplerate0-dev -y
          sudo ln -s -f /usr/bin/gcc-14 /usr/bin/gcc
          sudo ln -s -f /usr/bin/g++-14 /usr/bin/g++
          
      - name: Build
        run: |
          cmake .
          make -j$(nproc)

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: "bitsybox-linux-gcc14"
          path: |
            bitsybox

  # === Windows MinGW-64 ===
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup Mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            gcc

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install
        run: |
          pacman -S sdl2 nodejs

      - name: Build
        shell: bash
        run: |
          cmake .
          make -j$(nproc)
        
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: "bitsybox-windows-mingw"
          path: |
            bitsybox